<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .warnlevels {
            color: white;
            text-align: center;
            font-size: 60px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }
        .warnlevels .level1 {
            background-color: green;
            border: 3px solid rgb(2, 206, 2);
        }
        .warnlevels .level2 {
            background-color: red;
            border: 3px solid rgb(255, 85, 85);
        }
        .warnlevels .level3 {
            background-color: yellow;
            border: 3px solid orange;
        }
    </style>
</head>
<body>
    <div class="warnlevels">
        <span class="level1">fixed</span>
        <span class="level2">critical</span>
        <span class="level3">warning</span>
    </div>
</body>
</html>
